[package]
name = "gridroute"
version = "0.1.0"
edition = "2021"
description = "Grid PCB routing kernels (clearance masks, copper islands, A*, GPU cost-to-target field) with a C ABI, multi-threaded CPU and Metal GPU backends"
license = "MIT"
repository = "https://github.com/janekm/gridroute"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["metal"]
metal = ["dep:metal", "dep:objc"]

[dependencies]
rayon = "1.10"

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.32", optional = true }
objc = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[lints.rust]
# the objc crate's msg_send! expands cfg(feature = "cargo-clippy")
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
